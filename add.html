<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学习任务 - 新增</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 id="pageTitle">新增任务</h2>
    <form id="taskForm">
        <p>
            <label>学习任务：<input type="text" id="taskName"></label>
        </p>
        <p>
            <label>开始时间：<input type="text" id="startDate" placeholder="如：2026-5-25"></label>
        </p>
        <p>
            <label>结束时间：<input type="text" id="endDate" placeholder="如：2026-6-25"></label>
        </p>
        <p>
            <label>剩余天数：<input type="text" id="remaining" placeholder="如：5天"></label>
        </p>
        <p>
            <label>完成度：<input type="text" id="progress" placeholder="0-100" value="0">%</label>
        </p>
        <p>
            <label>学习内容：</label><br>
            <textarea id="taskContent" rows="6" cols="50" placeholder="请输入学习内容..."></textarea>
        </p>
        <p>
            <button type="button" onclick="window.location.href='index.html'">取消</button>
            <button type="submit">确认</button>
        </p>
    </form>
    <script>
        // 拿数据
        var tasks = JSON.parse(localStorage.getItem('studyTasks')) || [];
        // 看是不是编辑
        var editIndex = new URLSearchParams(window.location.search).get('edit');

        // 编辑就填数据
        if (editIndex !== null && tasks[editIndex]) {
            var t = tasks[editIndex];
            document.getElementById('pageTitle').textContent = '编辑任务';
            document.getElementById('taskName').value = t.name;
            document.getElementById('startDate').value = t.startDate;
            document.getElementById('endDate').value = t.endDate;
            document.getElementById('remaining').value = t.remaining;
            document.getElementById('progress').value = t.progress;
            document.getElementById('taskContent').value = t.content || '';
        }

        // 提交表单
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var name = document.getElementById('taskName').value;
            if (!name) { alert('请输入任务名称'); return; }
            var taskData = {
                name: name,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                remaining: document.getElementById('remaining').value,
                progress: document.getElementById('progress').value,
                content: document.getElementById('taskContent').value
            };

            if (editIndex !== null) {
                tasks[editIndex] = taskData;
            } else {
                tasks.push(taskData);
            }

            localStorage.setItem('studyTasks', JSON.stringify(tasks));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
